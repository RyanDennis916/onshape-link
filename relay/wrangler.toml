name = "onshape-link-token-relay"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The client id is public (it's baked into the desktop app too), so it lives
# here in version control rather than as a secret - that way what's deployed
# is exactly what's in src/main/config.ts, trailing "=" and all. It must
# match PUBLIC_DEFAULTS.onshapeClientId character-for-character.
[vars]
ONSHAPE_CLIENT_ID = "ZAW73EZCXM74WHCHMENZGR7RNJ3GFP6WCIPV4JQ="

# The only real secret. Set it with:
#   wrangler secret put ONSHAPE_CLIENT_SECRET
